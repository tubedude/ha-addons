---
version: 7.2.2
slug: mosquitto-ts
name: Mosquitto broker + Tailscale
description: Mosquitto with Tailscale built in — publishes MQTT over Funnel for clients that cannot run a VPN
url: https://github.com/home-assistant/addons/tree/master/mosquitto
arch:
  - aarch64
  - amd64
auth_api: true
discovery:
  - mqtt
# Pre-built image. Without this line the Supervisor builds locally, and the
# Dockerfile compiles libwebsockets + mosquitto from source (~6 min on a fast
# machine, considerably worse on an HA box). See build-and-push.sh.
# Note: only honoured for add-ons installed from a git repository — a local
# add-on dropped in /addons is always built from source.
image: tubedude/mosquitto-ts-{arch}
map:
  - ssl
  - share
options:
  logins: []
  log_dest: []
  log_type: []
  require_certificate: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  customize:
    active: false
    folder: mosquitto
  tailscale_authkey: ""
  tailscale_hostname: mosquitto
  tailscale_funnel_port: "8443"
ports:
  1883/tcp: 1883
  1884/tcp: 1884
  8883/tcp: 8883
  8884/tcp: 8884
schema:
  logins:
    - username: str
      password: password
      password_pre_hashed: "bool?"
      acl:
        - str?
  log_dest:
    - list(none|stdout|stderr|topic)?
  log_type:
    - list(none|debug|error|warning|notice|information|subscribe|unsubscribe|websockets|all)?
  require_certificate: bool
  certfile: str
  cafile: str?
  keyfile: str
  customize:
    active: bool
    folder: str
  tailscale_authkey: password?
  tailscale_hostname: str?
  tailscale_funnel_port: list(443|8443|10000)?
  debug: bool?
services:
  - mqtt:provide
startup: system
watchdog: tcp://[HOST]:1883
init: false
